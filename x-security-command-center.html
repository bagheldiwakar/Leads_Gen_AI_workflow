window.handoffToSales=function(){const x=data[selected];x.handoff=true;x.last="Qualified lead sent to sales";x.next="Sales owner to confirm discovery, sponsor and pilot path";localStorage.setItem(key,JSON.stringify(data));closeModal();render();};
})();
</script>

  const ai=await response.json();x.aiSummary=ai.summary;x.aiNextAction=ai.next_action;x.aiMessage=ai.message_draft;x.aiSource=ai.source;localStorage.setItem(key,JSON.stringify(data));
  result.innerHTML="<strong>"+ai.lifecycle_stage+" · "+ai.score+"/100</strong><br><br><b>What AI sees:</b> "+esc(ai.summary)+"<br><br><b>Next action:</b> "+esc(ai.next_action)+"<br><br><b>Suggested message:</b><br>"+esc(ai.message_draft);
 }catch(error){result.textContent="Start the Python backend first, then click Ask AI again. The dashboard can still use its normal manual workflow."; }
 finally{button.disabled=false;button.textContent="Ask AI for next step";}

 window.saveIdea=async function(){const idea=document.querySelector('#ideaText').value.trim();if(!idea)return;try{const r=await fetch('http://localhost:8011/api/ideas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idea,scope:document.querySelector('#ideaScope').value,scope_value:document.querySelector('#ideaScopeValue').value.trim(),status:document.querySelector('#ideaStatus').value,priority:Number(document.querySelector('#ideaPriority').value||50),end_date:document.querySelector('#ideaEnd').value})});if(!r.ok)throw new Error();document.querySelector('#ideaText').value='';await renderIdeas();}catch(e){alert('The idea could not be saved. Start the Python backend and try again.');}};

<script>
/* Live view: the backend Master Tracker is the single source of agent activity. */
(function(){
  const api='http://127.0.0.1:8011/api/master-tracker';
  const mapRow=row=>({
    Target:row.Target||'', Route:row.Route||'Partner',
    TargetType:row['Target Type']||row.TargetType||'', salesStatus:row['Lead Temperature']||'Not assessed',
    Priority:row.Priority||'', PrimaryRole:row['Primary Role']||row.PrimaryRole||'',
    SecondaryRole:row['Secondary Role']||row.SecondaryRole||'',
    PrimaryChannel:row['Primary Channel']||row.PrimaryChannel||'', MessageAngle:row.message_strategy||row['Message Angle']||'',
    Stage:row.Stage||'Research ready', last:row.last_update||row['Last Update']||row.message_status||'',
    next:row.next_action||row['Next Action']||'Set next action',
    latestReply:row.latest_reply||'', statusSummary:row['Status Summary']||'', followUpTiming:row['Follow-up Timing']||'',
    message_status:row.message_status||'', message_strategy:row.message_strategy||''
  });
  async function refreshLiveTracker(){
    try{
      const response=await fetch(api,{cache:'no-store'}); if(!response.ok)throw new Error();
      const rows=await response.json(); if(!Array.isArray(rows)||!rows.length)return;
      data=rows.map(mapRow); localStorage.setItem(key,JSON.stringify(data)); render();
    }catch(error){/* The saved view remains usable if the backend is offline. */}
  }
  window.refreshLiveTracker=refreshLiveTracker;
  refreshLiveTracker(); setInterval(refreshLiveTracker,10000);
})();
</script>
